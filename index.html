<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPaDE - Sistem Pangkalan Data Elektronik</title>
    <!-- Favicon / Ikon Tab Browser -->
    <link rel="icon" href="https://upload.wikimedia.org/wikipedia/commons/9/9d/Logo_Tut_Wuri_Handayani.png" type="image/png">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #f8fafc;
            font-family: 'Inter', sans-serif;
        }
        
        /* Styling untuk Iframe */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* Tampilan Loading sementara (sebelum iframe termuat sepenuhnya) */
        .loading-screen {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: -1;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #e2e8f0;
            border-top: 4px solid #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    
    <!-- Animasi Loading -->
    <div class="loading-screen">
        <div class="spinner"></div>
        <h2 style="margin:0; color:#1e293b; font-size:20px;">Memuat SIPaDE...</h2>
        <div style="margin:5px 0 0 0; color: #64748b; font-size: 14px;">Menghubungkan ke Pangkalan Data</div>
    </div>

    <!-- Iframe yang URL-nya diset melalui JavaScript -->
    <iframe id="sipadeFrame" title="SIPaDE App" allow="fullscreen"></iframe>

    <script>
        var gasUrl = "https://script.google.com/macros/s/AKfycbzwOlf_73tksMuAuMt0GsaUKEjHq9UVb3y1mstBXCh3bNIkMVsUNJrkUMDYoKPn7Tm83w/exec";
        
        var urlParams = new URLSearchParams(window.location.search);
        var pageParam = urlParams.get('page');
        
        // Teruskan page dari URL Github ke Apps Script menggunakan hash (karena Apps Script SPA membaca dari hash)
        if (pageParam) {
            gasUrl += "?authuser=0#" + pageParam;
        } else {
            gasUrl += "?authuser=0";
        }
        
        document.getElementById('sipadeFrame').src = gasUrl;

        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'SIPADE_URL_CHANGED') {
                var newUrl = new URL(window.location.href);
                // Menyamakan format dengan SIKAPEL (?page=...)
                var pageName = e.data.hash.replace('#', '');
                newUrl.searchParams.set('page', pageName);
                if (window.location.search !== newUrl.search) {
                    history.replaceState(null, null, newUrl.href);
                }
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIPaDE - Sistem Pangkalan Data Elektronik</title>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; background-color: #f8fafc; font-family: 'Inter', sans-serif; }
        iframe { width: 100%; height: 100%; border: none; }
        .loader { position: fixed; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; justify-content: center; align-items: center; background: #fff; z-index: 9999; transition: opacity 0.5s; }
        .spinner { width: 40px; height: 40px; border: 4px solid #f3f3f3; border-top: 4px solid #2563eb; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 20px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>
    <div id="loader" class="loader">
        <div class="spinner"></div>
        <h2 style="margin:0; color:#1e293b; font-size:20px;">Memuat SIPaDE...</h2>
        <p style="margin:5px 0 0 0; color:#64748b; font-size:14px;">Menghubungkan ke Pangkalan Data</p>
    </div>
    
    <!-- IFRAME yang mengarah ke Apps Script -->
    <iframe id="sipadeFrame" onload="document.getElementById('loader').classList.add('hidden')" allow="fullscreen"></iframe>

    <script>
        // MASUKKAN URL WEB APP ANDA DI BAWAH INI:
        var gasUrl = "https://script.google.com/macros/s/AKfycbzsfItipiuIrje6xLsLWWbZAg4PmEeZlSO3OhcrqUH8qRlGGvdl8r1dJcM9Wiuko8KXwQ/exec";
        
        document.getElementById('sipadeFrame').src = gasUrl;
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Publik SIPaDE</title>
  <style>
    :root {
      --bg: #f3f4f6; --tx: #1f2937; --card: #ffffff; --border: #e5e7eb;
      --primary: #2563eb; --primary-hov: #1d4ed8; --muted: #6b7280;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    body { background: var(--bg); color: var(--tx); margin: 0; padding: 20px; font-size: 14px; }
    .container { max-width: 1200px; margin: 0 auto; }
    .header { text-align: center; margin-bottom: 30px; position: relative; }
    .header h1 { margin: 0 0 10px; color: var(--primary); font-size: 28px; }
    .header p { margin: 0; color: var(--muted); }
    .btn-login { position: absolute; right: 0; top: 0; background: var(--primary); color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; text-decoration: none; font-weight: 500; font-size: 14px; }
    .btn-login:hover { background: var(--primary-hov); }
    
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .card h3 { margin: 0 0 16px; font-size: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px; color: var(--primary); }
    
    .grid { display: grid; gap: 20px; }
    .g4 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    .g2 { grid-template-columns: repeat(auto-fit, minmax(400px, 1fr)); }
    
    .stat { display: flex; align-items: center; gap: 16px; border-left: 5px solid var(--c); }
    .stat .ic { width: 48px; height: 48px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); font-size: 24px; }
    .stat .l { color: var(--muted); font-size: 13px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.5px; }
    .stat .n { font-size: 28px; font-weight: 700; margin-top: 4px; }
    
    .bar-row { display: flex; align-items: center; margin-bottom: 10px; gap: 12px; }
    .bar-row span { width: 140px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .bar-row .bar { flex: 1; background: var(--bg); border-radius: 6px; height: 12px; overflow: hidden; }
    .bar-row .bar i { display: block; height: 100%; background: var(--primary); border-radius: 6px; transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
    .bar-row b { width: 40px; text-align: right; font-size: 13px; }

    .toolbar { display: flex; gap: 12px; margin-bottom: 24px; align-items: center; background: var(--card); padding: 16px; border-radius: 12px; border: 1px solid var(--border); }
    .sel { padding: 8px 12px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); font-family: inherit; font-size: 14px; outline: none; cursor: pointer; flex: 1; max-width: 250px; }
    .sel:focus { border-color: var(--primary); }

    .spinner { border: 3px solid var(--border); border-top: 3px solid var(--primary); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 40px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .err { color: #dc2626; text-align: center; padding: 20px; background: #fee2e2; border-radius: 8px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>Dashboard Statistik Siswa</h1>
    <p>Informasi Data Pendidikan Terpusat</p>
    <!-- Tombol Login yang otomatis mengarah ke Web App SIPaDE asli -->
    <button class="btn-login" onclick="window.open(document.getElementById('sipadeUrl').value, '_blank')">Login Admin</button>
  </div>

  <input type="hidden" id="sipadeUrl" value="https://script.google.com/macros/s/AKfycbwc26wBqcs5G_TUuJAU8OSmpW9vDTgL8KKC5QHKzjT38g7jUoL0tpgQGTS2_DrHrdcM1g/exec">

  <div id="filterBar" class="toolbar hidden">
    <span class="muted" style="font-weight:600;">Filter Data:</span>
    <select class="sel" id="dfRombel" onchange="loadDashboard()"><option value="">Semua Rombel</option></select>
    <select class="sel" id="dfJk" onchange="loadDashboard()">
      <option value="">Semua JK</option>
      <option value="L">Laki-laki</option>
      <option value="P">Perempuan</option>
    </select>
  </div>

  <div id="content">
    <div class="spinner"></div>
  </div>
</div>

<script>
  function esc(s) { return String(s || '').replace(/[&<>'"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' })[c]; }); }
  function stat(l, n, ic, c) { return '<div class="card stat" style="--c:' + c + '"><span class="ic">' + ic + '</span><div><div class="l">' + l + '</div><div class="n" data-n="' + n + '">0</div></div></div>'; }
  function sortBars(o) {
    var ks = Object.keys(o).sort(function (a, b) { return o[b] - o[a] || a.localeCompare(b, 'id', { numeric: true }); });
    var m = Math.max.apply(null, ks.map(function (k) { return o[k]; }).concat([1]));
    return ks.length ? ks.map(function (k) { return '<div class="bar-row"><span title="' + esc(k) + '">' + esc(k) + '</span><div class="bar"><i style="width:0" data-w="' + (o[k] / m * 100) + '"></i></div><b>' + o[k] + '</b></div>'; }).join('') : '<p style="color:#6b7280;font-size:13px">Belum ada data.</p>';
  }

  function loadDashboard() {
    var url = document.getElementById('sipadeUrl').value;
    var rombel = document.getElementById('dfRombel').value;
    var jk = document.getElementById('dfJk').value;
    
    var endpoint = url + '?api=public_dashboard&rombel=' + encodeURIComponent(rombel) + '&jk=' + encodeURIComponent(jk);
    
    document.getElementById('content').innerHTML = '<div class="spinner"></div>';
    
    fetch(endpoint).then(r => r.json()).then(res => {
      if (!res.ok) throw new Error(res.message || 'Gagal mengambil data dari SIPaDE');
      var d = res.data;
      
      var selRombel = document.getElementById('dfRombel');
      if (selRombel.options.length <= 1) {
        var rombelChart = d.charts.find(c => c.key === 'rombel');
        if (rombelChart) {
          var rKeys = Object.keys(rombelChart.data).sort();
          rKeys.forEach(r => {
            var opt = document.createElement('option');
            opt.value = r; opt.textContent = r;
            selRombel.appendChild(opt);
          });
        }
      }
      document.getElementById('filterBar').classList.remove('hidden');

      var chartsHtml = d.charts.map(function(c) {
        return '<div class="card" style="margin-bottom:12px;">' +
               '<h3 style="padding:0 0 10px 0; margin:0 0 16px 0; border-bottom: 1px solid var(--border); font-size:16px;">' + esc(c.title) + '</h3>' +
               '<div>' + sortBars(c.data) + '</div></div>';
      }).join('');

      var h = '<div class="grid g4">' + 
        stat('Siswa Aktif', d.siswaAktif, '🎓', '#2563eb') + 
        stat('Laki-laki', d.laki, '👦', '#0891b2') + 
        stat('Perempuan', d.perempuan, '👧', '#db2777') + 
        stat('Guru & Tendik', d.guru, '👨‍🏫', '#059669') + 
        stat('Usulan PIP', d.pip, '💳', '#d97706') + 
        '</div>' +
        '<div style="margin-top:24px;">' + chartsHtml + '</div>';
      
      document.getElementById('content').innerHTML = h;

      document.querySelectorAll('[data-n]').forEach(function (n) {
        var to = +n.dataset.n, t0 = performance.now();
        (function tick(t) { var p = Math.min((t - t0) / 800, 1); n.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(tick); })(t0);
      });
      setTimeout(function () { 
        document.querySelectorAll('[data-w]').forEach(function (i) { i.style.width = i.dataset.w + '%'; }); 
      }, 60);

    }).catch(e => {
      document.getElementById('content').innerHTML = '<div class="err">' + esc(e.message) + '</div>';
    });
  }

  loadDashboard();
</script>

</body>
</html>
